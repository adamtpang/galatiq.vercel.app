# Unseen-layout invoices (data/invoices_unseen/). Written before running the pipeline on them; not tuned to results.
# offline: acceptable decisions with no LLM. A legitimate invoice must not be REJECTED; PENDING_HUMAN or APPROVED is fine.
# live: the invoice should be read correctly (vendor, total, items) and paid; that is the goal, not a guarantee.
