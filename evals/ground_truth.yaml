# Hand-checked ground truth for the extraction eval.
# Built by reading each source file directly (text, CSV, JSON, XML, and the PDF text layer via
# `pdftotext -layout`), NOT from the pipeline's output. Values are what the document PRINTS.
#
# Fields scored: vendor, invoice_number, total, line_items (name and quantity), due_date.
# - total is the printed total, even when the invoice's own math is wrong (see math_note).
# - line_items: one entry per printed line, as [canonical item name, quantity]. The canonical
#   name is the inventory SKU the printed name refers to ("Widget A" -> WidgetA); items that are
#   not in inventory keep their printed name. Repeated lines stay separate.
# - null means the field is genuinely absent from the document.
# - ambiguous: fields the document does not state unambiguously. They are reported but left
#   out of the accuracy denominator.
#
# Invoice numbers are compared after removing punctuation, spaces and a leading "INV", so
# "1002", "INV 1012" and "INV-1012" compare equal to INV-1002 / INV-1012.

data/invoices/invoice_1001.txt:
  vendor: Widgets Inc.
  invoice_number: INV-1001
  total: 5000.00
  due_date: 2026-02-01
  line_items: [[WidgetA, 10], [WidgetB, 5]]

