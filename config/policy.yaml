# Business rules for validation, risk and approval. Tune here, not in code.
# Approval rules (who approves what) are Adam's decisions. See docs/DECISIONS.md.

currency: USD

# Approval policy (Adam's decisions, see docs/DECISIONS.md). Read by the approval agent
# (invoice_agents/agents/approval.py) and the risk agent; validation adds info flags from the thresholds.
approval:
  approval_threshold_usd: 10000      # over this: extra scrutiny (critic loop)
  near_limit_usd: 9500               # total >= this counts as "near the limit": critic loop
  high_risk_score: 50                # risk_score >= this (0 to 100): critic loop
  critic_max_rounds: 2               # VP proposes, critic objects, at most 2 rounds
  on_deadlock: PENDING_HUMAN         # VP approves but critic still objects after max rounds
  critic_loop_only_when: [over_threshold, near_limit, high_risk]   # otherwise VP decides alone, after hard rules
  # Hard holds (decisions 8, 9 and 10): PENDING_HUMAN before any VP or critic call, whatever the risk score.
  # A blocking flag still rejects first (hard rules run before hard holds).
  hard_holds:
    prompt_injection: true           # risk signal prompt_injection fired (risk.injection_patterns), or live Grok risk review set prompt_injection
    vendor_renamed: true             # VENDOR_RENAMED flag ("formerly X")
    vendor_lookalike: true           # VENDOR_LOOKALIKE flag (name close to a vendor on file, see vendor_lookalike)
    llm_repaired: true               # decisions 10 and 14: Grok rebuilt the invoice from raw text and its reading is not confirmed (damaged file, a number not printed in the file, or vendor not on file)
    unreadable_layout: true          # decision 14: an invoice-like file the parser cannot read (and no Grok) is held, not rejected
    model_mismatch: true             # live: the API reported a model other than the configured one (model pin, README Repeatability)
    bank_details_changed: true       # decision 11: the invoice asks to pay a new or changed account (bank_details below)
    extraction_disagreement: true    # decision 12: live, Grok's independent reading differs from the parser's
    grok_check_failed: true          # decision 16: live, Grok's cross-check or risk review failed (GROK_CHECK_FAILED)
    foreign_currency: true           # decision 22: any non-USD invoice (CURRENCY_CONVERTED) waits for a person
  # Decision 16: after a hard-rule rejection, one review (Grok live; a rules stand-in offline) may escalate the
  # rejection to a person. It can never approve or pay; if it fails, the rejection stands.
  rejection_review: true

# Decision 11: payment-detail changes. Any match gives a BANK_DETAILS_CHANGED warning and a hard hold, so
# a person confirms the account with the vendor contact on file before anything is paid. A plain
# "Remit to" line also matches: the case samples carry no bank details at all, so any is worth a look.
bank_details:
  change_patterns:
    - '\biban\b'
    - '\bswift\b|\bbic\b'
    - '\b(routing|aba|sort)\s*(number|no\.?|#|code)'
    - '\bnew\s+(bank\s+)?account\b'
    - '\baccount\s+(number|no\.?|#)'
    - '\bremit(tance)?\s+to\b'
    - '\bbank(ing)?\s+(details|information|info|instructions)\b'
    - '\b(updated?|changed?|new)\s+(bank|banking|payment|remittance)\s+(account|details|information|info|instructions)\b'
    - '\b(updated?|changed?|new)\s+bank\b|\bchange\s+of\s+bank\b'
    # Review 2 (decision 11 wording gaps): short forms, moved banks, wire changes, digit runs near account words
    - '\bacct\b|\ba/c\s*(no\.?|number|#|:)'
    - '\baba\b'
    - '\b(routing|transit)\s*(number|no\.?|#|code)?\s*:?\s*\d{6,}'
    - '\b(moved|switched|changed|new)\s+(our\s+)?banks?\b'
    - '\bwire\s+(instructions?|details|info|information)\b|\b(new|updated?|changed?|different)\s+wire\b'
    - '\b(pay|send|wire|remit|transfer)\s+(it\s+|payment\s+|funds\s+|the\s+balance\s+)?(to|into)\b[^.\n]{0,30}\d{6,}'
    - '\b(account|acct|a/c|routing|aba|iban|sort\s+code|beneficiary)\b\s*(number|no\.?|num|#)?\s*[:#]?\s*\d(?:[\s-]?\d){7,}'
    - '\d(?:[\s-]?\d){7,}\s*\(?\s*(account|acct|routing|aba)\b'
  # Decision 20 (review 3): a pattern list cannot keep up with new wordings, so offline (no model reads the text)
  # any payment-instruction keyword in the invoice text holds it. Matched as whole words after NFKC
  # normalization, lower case and joining spaced-out letters. On the 20 case samples only 1003 matches
  # ("Wire transfer preferred."), which is an instruction about how to pay; 1003 is rejected by hard rules anyway.
  # Bare "account" is not a keyword ("Your account manager will call" is harmless); it counts when it names
  # where money goes: "bank account", "account ending", "account number", "our new account" and similar.
  payment_keywords: ['bank(?!\s+holidays?)', 'banks', 'banking', '(bank|checking|savings|business|deposit|new|our|the)\s+account',
                     'account\s+(number|no|num|#|ending|details|info|information)', 'acct', 'routing', 'aba', 'iban', 'swift',
                     'wire', 'wired', 'ach', 'zelle', 'venmo', 'paypal', 'crypto', 'cryptocurrency', 'bitcoin',
                     'btc', 'usdt', 'escrow', 'remit', 'remit-to', 'remittance', 'pay\s+to', 'send\s+funds',
                     'account\s+ending', 'new\s+details']

# Decision 7: duplicates by content. An invoice with the same vendor (normalized name), line items,
# quantities and total as an earlier one is a DUPLICATE_INVOICE (blocking) even under a new number.
duplicates:
  match_content: true

# Decision 9: a vendor not on file whose normalized name is this similar (difflib ratio, 0..1)
# to a vendor-master name or alias gets a VENDOR_LOOKALIKE flag.
vendor_lookalike:
  min_similarity: 0.85

arithmetic:
  tolerance: 0.01                    # dollars

price_variance:
  warn_above_pct: 10                 # unit price more than 10% above catalog -> warn
  info_below_pct: 10                 # more than 10% below catalog -> info

# Past due dates: a non-blocking PAST_DUE warning for people (CLI table, report, site). It is display only:
# the risk, VP and critic agents do not see it, so it never changes a decision.
due_dates:
  past_due_warning: true
  as_of: null                        # reference date, YYYY-MM-DD; null = the day of the run (env INVOICE_AS_OF overrides)

payment_terms:
  tolerance_days: 1                  # "Net 30" vs actual due-date gap (31-day months pass)

sku_matching:
  min_confidence: 0.85               # below this an item is treated as unknown

# Risk agent: deterministic signals, each adds its weight once. Score is capped at 100.
risk:
  weights:
    urgency_language: 20       # "URGENT", "pay immediately", "avoid penalties"
    wire_transfer: 20          # pressure to pay by wire, or to new bank details
    unknown_vendor: 20         # not in the vendor master
    suspicious_address: 30     # address on the watch list below
    threshold_gaming: 25       # total in [near_limit_usd, approval_threshold_usd]
    vendor_rename: 20          # "formerly X"
    math_mismatch: 25          # totals do not add up
    price_variance: 10         # unit price more than warn_above_pct over catalog
    prompt_injection: 40       # text that tries to instruct the system ("ignore previous instructions")
  urgency_patterns: ['\burgent\b', 'pay immediately', '\basap\b', 'avoid penalt', 'final notice', 'immediately']
  wire_patterns: ['wire transfer', '\bwire\b', 'new bank', 'change of bank', 'gift card', 'crypto', 'bitcoin']
  injection_patterns:          # text that tries to instruct the reviewer; any match is a hard hold (decision 8)
    - 'ignore (all |any )?(previous|prior|above) instructions'
    - '\b(note|message|instructions?|attention)\b[^.\n]{0,15}\b(to|for)\s+(the\s+|any\s+)?(automated|ai)\s+(system|reviewer|processor|agent)s?\b'   # a note addressed to the automated system (2002)
    - 'set the risk score'
    - '\bapprove\s+(this|the)\s+invoice\b[^.\n]{0,30}\b(without|no)\s+(review|checks?|verification|approval)\b|\b(auto-?approve|automatically\s+approve)\s+(this|the)\s+invoice\b'   # approve and skip the checks (3001)
    # Generic forms (reviewer pass). Every pattern is checked on all 30 test invoices and on harmless notes in
    # tests/test_approval.py; a plain 'approve this invoice' or 'automated system' no longer matches on its own.
    - '\b(ignore|disregard|forget|override|bypass)\s+(all\s+|any\s+)?(of\s+)?(your|the|these|those|its|my|our)?\s*(previous|prior|above|earlier|preceding|original|system|internal|standard|usual|existing)?\s*(instructions?|guidance|guidelines|rules|polic(y|ies)|prompts?)\b'   # override the rules; the rule word must follow directly, so "disregard the previous delivery instructions" does not match
    - '\b(to|for|dear|hey|hello|attention)\b[^.\n]{0,12}\b(ai|llm|assistant|bot)\b[\s-]{0,3}(reviewer|agent|system|assistant|model|checker)\b'   # addresses the AI (3002)
    - '\b(skip|bypass|without)\b[^.\n]{0,20}\b(human|manual)\s+(review|approval|check|verification)\b'                              # skip the human
    - '\bmark\s+(it|this(\s+invoice)?|the\s+invoice)\s+(as\s+)?(approved|paid|verified|low[\s-]risk)\b'                             # dictate the outcome
    - '\b(report|set|assign|give|rate)\b[^.\n]{0,20}\b(a\s+)?(low|zero)\s+risk\b'                                                    # dictate the score
    # Review 2: chat-role prefixes at the start of a line or field, "pre-cleared", "treat as verified", "ignore
    # previous", a scripted "final answer", and any prompt fence or role tag in the vendor's text.
    - '(?m)^\s*(notes?\s*:\s*|"?notes"?\s*:\s*"?)?(system|assistant|developer)\s*:'
    - '\[(system|assistant|developer)\]|<\s*/?\s*(system|assistant|developer|invoice_document|facts|im_start|im_end)\b'
    - '\bpre-?\s?(cleared|verified|authori[sz]ed|approved)\b'
    - '\btreat\s+(it\s+|this\s+(invoice\s+)?|the\s+invoice\s+)?as\s+(already\s+)?(verified|approved|cleared|trusted|legitimate|safe)\b'
    - '\bignore\s+(all\s+|any\s+)?(the\s+|your\s+)?(previous|prior|above|earlier)\b(?!\s+(invoice|bill|statement|version|revision|copy|order|shipment|delivery|po)\b)'
    - '\bfinal\s+answer\s*:'
    # Review 3: invented wordings. The text is NFKC-normalized and spaced-out letters are joined first, so the
    # fullwidth fence tag and "I g n o r e  p r e v i o u s" hit the patterns above.
    - '\bapproval\s+(step|stage|process)\s+(can|should|may|must|will)\b|\balready\s+(reviewed|approved|cleared|verified)\s+by\b|\b(reviewed|approved|cleared|verified)\s+by\s+(acme|finance|the\s+cfo|accounts\s+payable)\b[^.\n]{0,20}\balready\b'
    - '"(decision|risk_score|risk|role|approved)"\s*:'
    - '\bsystem\s+override\b'
    - '\bas\s+the\s+(language\s+model|ai|llm|assistant|model|reviewer)\b|\byour\s+(only\s+)?(job|task|role)\s+is\s+(only\s+)?to\b'
    - '\b(output|respond|reply|answer|return)\s+(with\s+)?"?(approve|approved|approval)\b'
    - '\bignor(er|ez)\s+(les|toutes\s+les)\s+(instructions|consignes|r[eè]gles)\b|\bignorier(en|e)?\b[^.\n]{0,30}\b(anweisungen|regeln)\b|\bignora(r)?\s+(las|todas\s+las)\s+(instrucciones|reglas)\b'
  # White House; the Simpsons' fictional address (found by Grok on 1004_revised). Decision 13: an entry does not
  # fire on the address the vendor master has on file for that vendor (Precision Parts Ltd. is on file at
  # 742 Evergreen Terrace in this mock data), only on another vendor using it (data/invoices_adversarial 3007).
  suspicious_addresses: ['1600 pennsylvania ave', '742 evergreen terrace']
  llm_review: true             # live mode: Grok may add reasons and raise the score, never lower it

# Mock FX table (units of USD per 1 unit of currency). Fixed so runs are deterministic.
fx_to_usd:
  USD: 1.0
  EUR: 1.08
  GBP: 1.27
  CAD: 0.73

# Decisions made by Adam (see docs/DECISIONS.md). Encoded as flag severities.
decisions:
  stock_exceeded: reject             # qty > stock after aggregating repeated lines: blocking STOCK_EXCEEDED flag
